name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-ve-paket:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Paketler
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-paket.txt
      - name: Testler
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s . -p "test_*.py" -v
      - name: Paket
        run: python paketle.py
      - uses: actions/upload-artifact@v4
        with:
          name: TozBoyaHesap-windows
          path: dist/TozBoyaHesap_*.zip
